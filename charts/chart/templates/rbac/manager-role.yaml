apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "operator-cache.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - cache.craftainer.dev
  resources:
  - cacheservers
  - clustercacheservers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cache.craftainer.dev
  resources:
  - cacheservers/status
  - cacheusers/status
  - clustercacheservers/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - cache.craftainer.dev
  resources:
  - cacheusers
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cache.craftainer.dev
  resources:
  - cacheusers/finalizers
  verbs:
  - update
