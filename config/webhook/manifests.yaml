---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-cache-craftainer-dev-v1alpha1-cacheserver
  failurePolicy: Fail
  name: vcacheserver-v1alpha1.kb.io
  rules:
  - apiGroups:
    - cache.craftainer.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - cacheservers
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-cache-craftainer-dev-v1alpha1-clustercacheserver
  failurePolicy: Fail
  name: vclustercacheserver-v1alpha1.kb.io
  rules:
  - apiGroups:
    - cache.craftainer.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - clustercacheservers
  sideEffects: None
