apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[]'
    capabilities: Basic Install
    categories: Developer Tools
    description: A Kubernetes operator that provisions Valkey and Redis ACL users on Valkey or Redis servers (cache.craftainer.dev).
    # Pod Security `restricted` and a suggested install namespace for OLM v0
    # (OLM v1 installs into the ClusterExtension's namespace).
    operatorframework.io/suggested-namespace: operator-cache-system
    # OpenShift infrastructure features (EB-5): "disconnected" is true when
    # every image the operator runs is listed in spec.relatedImages (the
    # bundle step pins and lists the manager image). "proxy-aware" and
    # "fips-compliant" are "false" in the features.operators.openshift.io keys
    # below: the operator reads no HTTP(S)_PROXY (set proxy-aware once it does), and
    # the build has no GOFIPS140 run with GODEBUG=fips140=on (see the Dockerfile).
    operators.openshift.io/infrastructure-features: '["disconnected"]'
    # The same features as OpenShift's current keys (EB-5). Not proxy-aware: the
    # operator reads no HTTP(S)_PROXY; a server's proxy is its spec.proxyURL.
    features.operators.openshift.io/disconnected: "true"
    features.operators.openshift.io/fips-compliant: "false"
    features.operators.openshift.io/proxy-aware: "false"
    features.operators.openshift.io/tls-profiles: "false"
    features.operators.openshift.io/token-auth-aws: "false"
    features.operators.openshift.io/token-auth-azure: "false"
    features.operators.openshift.io/token-auth-gcp: "false"
    repository: https://github.com/craftainer-labs/operator-cache
  name: operator-cache.v0.0.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: ClusterCacheServer is a cluster-scoped Valkey or Redis server that the namespaces in allowedNamespaces may claim from.
      displayName: Cluster Cache Server
      kind: ClusterCacheServer
      name: clustercacheservers.cache.craftainer.dev
      version: v1alpha1
    - description: CacheServer is a Valkey or Redis server that only claims in its own namespace may use.
      displayName: Cache Server
      kind: CacheServer
      name: cacheservers.cache.craftainer.dev
      version: v1alpha1
    - description: CacheUser is an ACL user of a Valkey or Redis server, limited to the tenant's key prefix, written to a binding Secret.
      displayName: Cache User
      kind: CacheUser
      name: cacheusers.cache.craftainer.dev
      version: v1alpha1
  description: |-
    Provisions Valkey and Redis ACL users from Kubernetes resources. A
    ClusterCacheServer or CacheServer names the server and its admin
    credentials; a CacheUser in a team's namespace claims from it, with access
    limited to the tenant's key prefix.
  displayName: Cache Operator
  install:
    spec:
      deployments: null
    strategy: ""
  # AllNamespaces is the only mode OLM v1 (ClusterExtension) installs without
  # legacy compatibility; OLM v0 supports it too.
  installModes:
  - supported: false
    type: OwnNamespace
  - supported: false
    type: SingleNamespace
  - supported: false
    type: MultiNamespace
  - supported: true
    type: AllNamespaces
  keywords:
  - operator
  - craftainer
  links:
  - name: Source
    url: https://github.com/craftainer-labs/operator-cache
  maintainers:
  - email: maintainers@example.com
    name: Maintainers
  maturity: alpha
  minKubeVersion: 1.33.0
  provider:
    name: craftainer
    url: https://github.com/craftainer
  # The manager image is added by `make bundle` (scripts/bundle-fixup.sh) with
  # the digest it was built for.
  relatedImages: []
  version: 0.0.0
