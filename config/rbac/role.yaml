---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - cache.craftainer.dev
  resources:
  - cacheservers
  - clustercacheservers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cache.craftainer.dev
  resources:
  - cacheservers/status
  - cacheusers/status
  - clustercacheservers/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - cache.craftainer.dev
  resources:
  - cacheusers
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cache.craftainer.dev
  resources:
  - cacheusers/finalizers
  verbs:
  - update
