# The integration Valkey: one TLS port and no plain one, ACLs from a file with
# the administrator only, nothing persisted.
port 0
tls-port 6379
tls-cert-file /tls/server.crt
tls-key-file /tls/server.key
tls-ca-cert-file /tls/ca.crt
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
aclfile /tls/users.acl
save ""
appendonly no
